openapi: 3.1.0
info:
  title: NP1 Control Center API
  version: 0.1.0
  description: >-
    管理ネットワークへの接続をアクセス制御の境界とする。Webパスワード不要。
    変更APIは自動発行cookieとX-CSRF-Token、同一Origin、X-Request-IDが必要。
    byteカウンタはJSで精度を失わない10進文字列。観測時刻はUTC RFC3339。
servers:
  - url: /api/v1
paths:
  /nas-backup:
    get:
      summary: 常時・緊急録画のNAS設定と自動転送・現在ジョブの状態
      description: 経路別の保存先は返すがユーザー名・パスワードは返さない。資格情報は設定済みのboolのみ。
      responses:
        '200': {description: 'Observation。data.settingsにrevisionとpolicies.video/event、data.jobに進捗、data.automaticに自動実行状態。'}
  /nas-backup/policies:
    put:
      summary: 録画種別・経路ごとのNAS設定を部分更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, policies]
              properties:
                expectedRevision: {type: integer, minimum: 0}
                policies:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    video: {$ref: '#/components/schemas/NASPolicyChange'}
                    event: {$ref: '#/components/schemas/NASPolicyChange'}
      responses:
        '200': {description: 保存した設定のObservation。資格情報は非公開。}
        '400': {description: 入力不正}
        '409': {description: revision競合または転送中}
  /nas-backup/test:
    post:
      summary: 保存済みの対象フォルダーを選択した経路だけで接続確認
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, kind, route]
              properties:
                expectedRevision: {type: integer, minimum: 0}
                kind: {type: string, enum: [video, event]}
                route: {type: string, enum: [wifi, tailscale]}
      responses:
        '200': {description: フォルダーの接続・読取り確認。録画は書き込まない。}
        '409': {description: 設定競合・指定SSID未接続}
        '503': {description: 選択経路または保存先を確認できない}
  /nas-backup/jobs:
    post:
      summary: SDカードにある確定済み原本1件を非同期転送・再開
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, recordingID]
              properties:
                expectedRevision: {type: integer, minimum: 0}
                recordingID: {type: string, minLength: 1, maxLength: 1024, description: カードに結び付いた録画ID。任意パスを指定できない。}
      responses:
        '202': {description: 'Observation。ジョブのid/status/progressを含む。進捗はGET /nas-backupで取得。'}
        '409': {description: 設定競合・処理中・原本未確定・SD交換}
  /nas-backup/jobs/{id}:
    delete:
      summary: このジョブを中断し、該当種別の自動再試行を一時停止
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
      responses:
        '200': {description: 中断要求を受理。同じ録画の手動再開または該当設定の保存で自動実行を再開。}
        '409': {description: 終了済み・存在しないジョブ}
  /camera/sessions/{id}/h264:
    get:
      summary: 前方または車内の既存H.264をvideo-only fMP4でライブ配信
      description: 同じブラウザー所有セッションのみ。同時2配信。再エンコードせずSD書込中の映像を読む。停止・切断で配信枠を解放。音声は含めない。
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: MSE向け初期化segmentと連続moof/mdat。各カメラのcodec・寸法・fpsをheaderに返す。
          content:
            video/mp4: {schema: {type: string, format: binary}}
        '403': {description: 未所有・期限切れセッション}
        '429': {description: 同時配信上限・準備中}
        '503': {description: 現在の純正録画が取得不能・未稼働・未対応}
  /system/services:
    get:
      summary: 固定allowlistの純正サービス状態と操作可否
      responses:
        '200':
          description: 'Observation。状態取得不可の場合はunknown、未導入/不明行は操作不可。'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Observation'}
                  - type: object
                    properties:
                      data:
                        type: [array, 'null']
                        items: {$ref: '#/components/schemas/StockService'}
  /system/services/{id}/actions:
    post:
      summary: 純正サービスを個別に起動・停止・再起動して状態確認
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, description: 固定allowlistのopaque id。unit名やcommandではない。}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, expectedInvocationID, expectedState]
              properties:
                action: {type: string, enum: [start, stop, restart]}
                expectedInvocationID: {type: string, description: '直前GETのinvocationID。未起動inactiveでは空の場合がある。'}
                expectedState: {type: string, enum: [active, inactive, failed]}
      responses:
        '200':
          description: 'appliedは実動作のread-back後。起動/再起動は3秒、停止は1秒の連続安定を確認。'
          content:
            application/json:
              schema:
                type: object
                required: [status, action, previous, service, observedAt]
                properties:
                  status: {type: string, const: applied}
                  action: {type: string, enum: [start, stop, restart]}
                  previous: {$ref: '#/components/schemas/StockService'}
                  service: {$ref: '#/components/schemas/StockService'}
                  observedAt: {type: string, format: date-time}
        '400': {description: 'INVALID_SERVICE_REQUEST/ACTION/STATE。型・未知field・入力不正。'}
        '404': {description: UNKNOWN_STOCK_SERVICE。allowlist外。}
        '409': {description: 'SERVICE_BUSY/STATE_CHANGED/NOT_CONTROLLABLE/DEPENDENCY_ACTIVE/DEPENDENCY_UNAVAILABLE。他操作・状態変化・制御不可・カメラ依存稼働中/不明。停止/再起動前と起動前の依存を再取得する。'}
        '503': {description: 'SERVICE_UNAVAILABLE/COMMAND_FAILED/FAILED/NOT_CONFIRMED。成功扱いにせず状態再取得。'}
  /auth/session:
    get:
      summary: パスワード不要のCSRFセッション開始または取得
      responses:
        '200':
          description: csrf、role、expires。これはWebログインではない。
        '429':
          description: 自動セッション数の上限
  /system/summary:
    get:
      summary: 項目名からObservationへのmap
      responses:
        '200':
          description: 各観測はstatus、observedAt、source、refreshSeconds、verified、data、reasonを持つ。gpsは新しい有効測位だけを返し、recordingは原本ファイルの更新から録画状態を観測する。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: '#/components/schemas/Observation'}
                properties:
                  recording:
                    allOf:
                      - {$ref: '#/components/schemas/Observation'}
                      - type: object
                        properties:
                          data: {$ref: '#/components/schemas/RecordingStatus'}
        '503':
          description: 実機brokerに接続できない
  /capabilities:
    get:
      summary: 機能ごとの状態と制限
      responses:
        '200':
          description: id、status、reason、writableの配列。取得可能性と設定可能性を分離する。
  /storage/files:
    get:
      summary: SDディレクトリ一覧（最大300件、読み取り専用）
      parameters:
        - in: query
          name: path
          schema: {type: string, default: '.'}
          description: SDルートからの相対パス。親参照・絶対パス・symlink不可。
      responses:
        '200':
          description: name、path、size（10進文字列）、modified、directory、mediaの配列
        '400':
          description: NO_SDまたは不正なパス
  /storage/file:
    get:
      summary: 原本取得・HTTP Range
      parameters:
        - in: query
          name: path
          required: true
          schema: {type: string}
        - in: query
          name: download
          schema: {type: string, enum: ['1']}
        - in: header
          name: Range
          schema: {type: string}
      responses:
        '200': {description: ファイル本体。ftypを確認したMP4だけinline。その他はoctet-stream attachment。}
        '206': {description: 部分応答。Accept-Ranges・Content-Rangeあり。}
        '416': {description: Rangeがファイルの範囲外}
        '400': {description: NO_SDまたは不正なパス}
  /recordings:
    get:
      summary: 確定済みドラレコ録画の時刻索引（読み取り専用）
      description: >-
        DRIVERECDATA/Video・Event・Parkingの既知ファイル名をJSTとして解釈する。
        bounded MP4 box解析でftyp・確定moov・有限duration・映像trackを確認する。
        更新直後/書込中候補はpendingFiles、古い不正MP4はunreadableFilesへ数え、clipsには含めない。
        15秒キャッシュでもSDのmount identityを照合する。date指定時もdaysは全日付を返す。
      parameters:
        - in: query
          name: date
          schema: {type: string, format: date}
          description: YYYY-MM-DD（JST）。その日と重なる録画だけ返す。省略時は全確定録画。
      responses:
        '200':
          description: ObservationのdataがRecordingCatalog
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Observation'}
                  - properties:
                      data: {$ref: '#/components/schemas/RecordingCatalog'}
        '400': {description: INVALID_DATE。存在しない日付または形式不正。}
        '503': {description: RECORDINGS_UNAVAILABLE。SDなし・変更中・読取不能・broker接続不可。}
  /recordings/days:
    get:
      summary: カレンダー用の録画日付索引（JST）
      responses:
        '200':
          description: ObservationのdataがRecordingDay配列。日付降順。
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Observation'}
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/RecordingDay'}}
        '503': {description: RECORDINGS_UNAVAILABLE}
  /recordings/track:
    get:
      summary: 録画日の実測走行経路と再生時刻の対応
      description: 有効なNMEA測位だけを返す。未測位、5秒超の欠測、異常移動は別segmentに分け、位置を補間しない。日付はJST、各点の時刻はUTC。
      parameters:
        - in: query
          name: date
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Observationのdataに日付、points、segments、sourceTruncated、indexedAt。未測位時は空配列とreason。
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Observation'}
                  - properties:
                      data:
                        type: object
                        required: [date, points, segments, source, sourceTruncated, indexedAt]
                        properties:
                          date: {type: string, format: date}
                          source: {type: string}
                          indexedAt: {type: string, format: date-time}
                          sourceTruncated: {type: boolean}
                          reason: {type: string}
                          points:
                            type: array
                            items:
                              type: object
                              required: [at, lat, lon, segment]
                              properties:
                                at: {type: string, format: date-time}
                                lat: {type: number}
                                lon: {type: number}
                                segment: {type: integer}
                                speedMps: {type: number}
                                heading: {type: number}
                          segments:
                            type: array
                            items:
                              type: object
                              required: [id, start, end, pointCount, distanceKm, drivingSeconds]
                              properties:
                                id: {type: integer}
                                start: {type: string, format: date-time}
                                end: {type: string, format: date-time}
                                pointCount: {type: integer}
                                distanceKm: {type: [number, 'null']}
                                drivingSeconds: {type: [number, 'null']}
        '400': {description: 日付なし、不正日付、重複/未対応パラメーター}
        '503': {description: SDまたは位置記録を読み取れない}
  /recordings/{id}/stream:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
        description: 索引が返したopaque ID。SD交換後の古いIDは拒否する。
    get:
      summary: 確定MP4原本をinline配信。映像・音声とも再エンコードしない。
      parameters:
        - in: header
          name: Range
          schema: {type: string}
        - in: header
          name: If-Range
          schema: {type: string}
      responses:
        '200': {description: video/mp4、inline。ブラウザーのnative seek/音声再生用。}
        '206': {description: Accept-Ranges、Content-Range付き部分応答。先頭・末尾Rangeに対応。}
        '304': {description: If-Modified-Sinceにより変更なし。}
        '409': {description: SD_CHANGEDまたはRECORDING_NOT_FINALIZED。一覧を更新する。}
        '416': {description: Rangeが範囲外}
        '503': {description: SDなし・読取不能・broker接続不可}
  /recordings/{id}/download:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    get:
      summary: 同じ確定原本をattachmentとして取得（読み取り専用）
      parameters:
        - in: header
          name: Range
          schema: {type: string}
      responses:
        '200': {description: application/octet-stream、元ファイル名のattachment。変換なし。}
        '206': {description: HTTP Range部分応答}
        '409': {description: SD_CHANGEDまたはRECORDING_NOT_FINALIZED}
        '416': {description: Rangeが範囲外}
        '503': {description: SDなし・読取不能・broker接続不可}
  /camera/sessions:
    post:
      summary: 映像表示を直接開始（許可画面なし・無閲覧30秒で失効）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source: {type: string, enum: [front, in]}
                color: {type: string, enum: [auto, source], default: auto}
      responses:
        '201': {description: id、idleTimeout=30、fps=1、width=640、height=360}
        '403': {description: CSRFセッションが不足}
        '429': {description: 配信数上限}
  /camera/sessions/{id}/stream:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    get:
      summary: 最新JPEG1枚。ブラウザーが最大1fpsで更新する。
      responses:
        '200': {description: JPEG。フレームごとにexportを再open。}
        '403': {description: セッション不一致・期限切れ・許可なし}
        '429': {description: RESOURCE_BUSY}
        '503': {description: フレームなし・15秒超stale}
  /camera/sessions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    delete:
      summary: 自分の閲覧セッションを停止
      responses:
        '200': {description: 停止済み}
  /settings:
    get:
      summary: 表示設定を取得
      responses:
        '200': {description: revision、theme、locale、favorites}
    put:
      summary: expectedRevisionとsettingsを指定して保存
      responses:
        '200': {description: 更新後の設定とrevision}
        '409': {description: REVISION_CONFLICT}
        '400': {description: 入力値不正}
  /backup/export:
    post:
      summary: 表示設定だけをエクスポート
      responses:
        '200': {description: schemaVersion=1、settings、excludes。credentialや純正設定を含まない。}
  /backup/restore:
    post:
      summary: schemaVersion、expectedRevision、dryRun、settingsで復元を検証/適用
      responses:
        '200': {description: dryRun時はbefore/after。実適用時は新revision付き設定。}
        '409': {description: REVISION_CONFLICT}
  /events:
    get:
      summary: 10秒ごとのrefreshイベント（SSE）
      responses:
        '200': {description: text/event-stream。各イベントを契機に観測APIを取得する。}
  /logs:
    get:
      summary: 本文や秘密値を含まない操作履歴
      responses:
        '200': {description: application/x-ndjson。512KiB上限の現在世代。}
  /vpn/tailscale/name:
    put:
      summary: Tailscaleの機器ホスト名を変更しstatusで確認
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedHostName, hostName]
              properties:
                expectedHostName: {type: string, minLength: 1, description: 編集開始時のhostName。deviceName/DNSNameとは区別する。}
                hostName: {type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'}
      responses:
        '200': {description: 'Tailscale Observation。data.hostNameの反映を確認済み。dataにはaccountName/accountLogin/deviceName/hostName/dnsName/nameWritableも含む。deviceNameは管理コンソールの設定等でhostNameと異なる場合がある。'}
        '400': {description: 'INVALID_TAILSCALE_NAME。形式・型・未知field不正。'}
        '409': {description: 'TAILSCALE_BUSY/NOT_REGISTERED/NAME_CONFLICT/IDENTITY_CHANGED。別操作または登録状態の変化。'}
        '503': {description: 'TAILSCALE_UNAVAILABLE/RENAME_FAILED/RENAME_NOT_CONFIRMED。成功扱いにせず状態再取得。'}
  /vpn/tailscale/login:
    post:
      summary: 引数なしの固定ログイン操作。DNS/route受入/SSH/netfilter操作は無効。
      responses:
        '200': {description: authURL。所有者が認証を完了する必要がある。監査やバックアップにURLを記録しない。}
        '503': {description: 未導入またはWAN/daemonに接続できない}
  /radio/history:
    get:
      summary: ローカル観測履歴の測定点・経路・固定地理グリッド。読み取りだけでは記録を開始しない。
      parameters:
        - {in: query, name: days, schema: {type: integer, minimum: 1, maximum: 365, default: 7}}
        - {in: query, name: metric, schema: {type: string, enum: [rsrp, sinr, rsrq], default: rsrp}}
        - {in: query, name: cellSize, schema: {type: integer, enum: [20, 50, 100], default: 50}}
        - {in: query, name: carrier, schema: {type: string}}
        - {in: query, name: band, schema: {type: string}}
        - {in: query, name: tripWeighted, schema: {type: boolean, default: true}}
        - {in: query, name: includeUnknownAccuracy, schema: {type: boolean, default: false}}
      responses:
        '200': {description: points/cellsと欠測・圏外・測位精度除外の件数。GPS無効を座標0へ置換しない。}
        '400': {description: 範囲外の期間・指標・グリッド}
  /device/led:
    get:
      summary: NCCが受理した設定とworker命令状態。物理点灯の読戻しではない。
      responses:
        '200': {description: Observation。settings、serviceState、lastCommand。}
    put:
      summary: expectedRevisionとsettingsで単色・レインボー・消灯を適用。失敗時に直前設定を復元。
      responses:
        '200': {description: worker命令確認済みのObservation。停止は全5ゾーン消灯。}
        '409': {description: revision競合、他LEDサービス稼働中、worker確認失敗}
  /radio/heatmap/legend:
    get:
      summary: 独立した指標ごとの凡例
      parameters:
        - in: query
          name: metric
          schema: {type: string, enum: [rsrp, sinr, rsrq], default: rsrp}
      responses:
        '200': {description: metric、unit、thresholds、note。最小値以上・次の上位境界未満。}
  /network/wifi/networks:
    get:
      summary: STA状態、稼働network、秘密を除いたNCC保存profile、接続確認transaction
      responses:
        '200': {description: 'status/networks/saved/transaction。networks.idはwpa数値ID、saved.idはNCC UUID。passwordは返さない。'}
        '503': {description: '制御socket/状態/復旧journalを確認できない'}
  /network/wifi/scan:
    post:
      summary: 既存supplicantへSCAN要求し直近の検出結果を返す
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {description: 'scanRequested/results/resultsAreCached。直後の結果はcacheの場合がありscan完了を意味しない。'}
  /network/wifi/connect-new:
    post:
      summary: NCC所有networkを追加して90秒の接続確認を開始
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ssid, security]
              properties:
                ssid: {type: string, description: 'UTF-8の1〜32bytes、制御文字不可'}
                security: {type: string, enum: [open, wpa2]}
                password: {type: string, writeOnly: true, description: 'wpa2は8〜63 printable ASCIIまたは64hex。openは空。'}
      responses:
        '200': {description: 'pending transaction。確定前は保存profileを作成しない。'}
        '409': {description: '別の接続確認中'}
  /network/wifi/connect-saved:
    post:
      summary: 稼働中networkIDまたはprivate保存profileIDで接続確認開始
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {type: object, additionalProperties: false, required: [networkID], properties: {networkID: {type: integer, minimum: 0, maximum: 1000000}}}
                - {type: object, additionalProperties: false, required: [profileID], properties: {profileID: {type: string}}}
      responses:
        '200': {description: 'pending transaction。ID種別は排他的、秘密の再取得不要。'}
  /network/wifi/confirm:
    post:
      summary: 接続先ID/SSID/COMPLETED/所有権をread-backして確定・private保存
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [transactionID], properties: {transactionID: {type: string}}}
      responses:
        '200': {description: 'confirmed transaction'}
        '409': {description: '期限切れ、接続未確認、対象transactionなし'}
  /network/wifi/rollback:
    post:
      summary: 独立contextで元接続を復旧し今回のown networkだけ削除
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [transactionID], properties: {transactionID: {type: string}}}
      responses:
        '200': {description: '元ID/SSIDのCOMPLETED確認後rolled-back。元接続なしならDISCONNECTED確認。'}
        '503': {description: '復旧または所有権未確認。journalを保持し成功表示しない。'}
  /network/hotspot:
    get:
      summary: ホットスポットの設定・実動作・共有上流・associated端末を返す
      responses:
        '200':
          description: 'Observation.dataにsettings/ssid/enabled/dhcpReady/channel/clientCount/clients/clientsAvailable/sharing/internetForwarding。sharingはenabled/state/ready/dnsReady/upstream(kind/interface/source/observedAt)/errorCode/observedAt。readyはkernelとDNS所有待受の確認であり外部Internet疎通保証ではない。上流不在でもAP維持。PSK非公開。leaseだけの端末を接続中としない。'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APStatus'}
    put:
      summary: ホットスポット設定を保存し専用unit再起動・read-back、失敗時旧設定復元
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, settings]
              properties:
                expectedRevision: {type: integer, minimum: 0}
                settings:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    enabled: {type: boolean}
                    ssid: {type: string}
                    passphrase: {type: string, writeOnly: true, description: '省略/空欄は保存済み値維持。新規有効化時8〜63 printable ASCII。'}
                    preference: {type: string, enum: [cellular, wifi], description: '優先する共有上流。単独変更はAPを再起動せずhot反映。未指定は既存値を保持。'}
      responses:
        '200': {description: 'APStatus Observation。AP設定変更はENABLED/DHCPまたは停止、preference単独変更はrevision/優先設定の反映を確認。SSID/enabled/PSK省略は温存。実上流はsharing.upstream.kindで別に示す。'}
        '409': {description: '競合、入力不正、適用/復旧未確認'}
  /trips:
    get:
      summary: JSTの日別・走行別距離と時間、測位欠測の証跡
      parameters:
        - {in: query, name: period, schema: {type: string, enum: ['7', '30', '90', '365', all, custom]}}
        - {in: query, name: from, schema: {type: string, format: date}, description: custom時の開始日}
        - {in: query, name: to, schema: {type: string, format: date}, description: custom時の終了日（包含）}
      responses:
        '200': {description: 'Observation。dataにrange/days/period/trips/各切詰めflag/取得元診断。未測位を距離0としない。'}
        '400': {description: '期間・重複引数・日付形式不正'}
  /radio/logger:
    get:
      summary: 常時ロガーの稼働・保存件数・測位つき件数
      responses:
        '200': {description: 'Observation.dataにenabled/active/stored/located/lastObservedAt/lastStoredAt。個別同意ゲートなし。'}
  /device/native-settings:
    get:
      summary: ファームウェア照合済みの純正設定と操作可能な選択肢
      responses:
        '200': {description: 'Observation.data.items。valueはnative保存整数。0を一律OFFへ変換しない。writable/kind/optionsで操作可能性を示す。'}
  /device/native-settings/{id}:
    put:
      summary: 純正APIで検証済みの設定だけ変更し永続保存を確認
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, enum: [privacy-mode, driving-support, service-cabin-camera, traffic-check, traffic-congestion, traffic-regulation, ferry, toll-road, smart-ic, tailgating-detection, tailgating-sensitivity, route-search, daily-voice, support-voice, front-car-start, signal-change]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expectedValue, value], properties: {expectedValue: {type: integer}, value: {type: integer}}}
      responses:
        '200': {description: '再取得したNativeSettings Observation。純正共有値と保存fileを照合済み。'}
        '403': {description: '未検証の変更項目'}
        '409': {description: '変更前の値が不一致'}
        '503': {description: '現在値・vendor変更・永続保存のいずれかが未確認'}
  /device/native-audio:
    get:
      summary: 純正Settingへ照会した音量・消音・音量補正
      responses:
        '200': {description: 'Observation.dataにmasterVolume（現在値のみ）、mute{value,enabled}、correction{value,label}、writable/reason。muteはnative0=消音ON、1=OFF。補正は0=OFF/1=弱/2=強。'}
        '409': {description: '他の純正設定操作を確認中'}
        '503': {description: '現在値・保存値・専用helperの応答が未確認'}
  /device/native-audio/{id}:
    put:
      summary: 消音または音量補正を変更し純正共有値・永続保存・最終照会を確認
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, enum: [mute, volume-correction]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedValue, value]
              properties:
                expectedValue: {type: integer, minimum: 0, maximum: 2}
                value: {type: integer, minimum: 0, maximum: 2, description: 'muteのみ0..1。volume-correctionは0..2。master音量の変更は提供しない。'}
      responses:
        '200': {description: '最終照会したNativeAudio Observation。保存前の値だけでは成功としない。'}
        '400': {description: '未知/重複キー、非整数、範囲外、複数JSON'}
        '404': {description: '未対応の音声設定'}
        '409': {description: '現在値不一致または他の操作中'}
        '503': {description: '現在値・変更・永続保存・最終照会のいずれかが未確認'}
  /device/ota-policy:
    get:
      summary: 純正OTAの新規取得抑止状態
      responses:
        '200': {description: 'Observation.dataにdisabled/managed/token/writable/scope。進行中処理は中断しない。'}
    put:
      summary: 管理済みOTA抑止flagだけを切り替える
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expectedToken, disabled], properties: {expectedToken: {type: string, minLength: 64, maxLength: 64}, disabled: {type: boolean}}}
      responses:
        '200': {description: '実file状態を再取得したObservation'}
        '409': {description: 'token不一致または他actorによる変更'}
        '503': {description: '管理記録・変更後の確認が不成立'}
  /network/cellular/apn:
    get:
      summary: APNの編集用保存設定（資格情報は値を返さない）
      responses:
        '200': {description: 'revision/profiles/appliedRevision/applyAvailable/applyReason。保存と回線適用は別。'}
    put:
      summary: 2つのAPNプロファイルをprivate領域へ保存
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, profiles]
              properties:
                expectedRevision: {type: integer, minimum: 0}
                profiles: {type: array, minItems: 2, maxItems: 2, items: {type: object, description: 'id(profile1/profile2),enabled,apn,auth(0..3)、optional username/password/clearUsername/clearPassword。未指定の秘密値は保持。'}}
      responses:
        '200': {description: '保存値の再取得。回線適用完了とは扱わない。'}
        '400': {description: '型、文字数、認証方式、未知field不正'}
        '409': {description: 'revision競合'}
  /network/cellular/apn/apply:
    post:
      summary: 保存APNの回線適用（現在は変更経路検証中）
      responses:
        '503': {description: '適用未提供。保存だけで成功にしない。'}
  /device/alexa:
    get:
      summary: 純正Voiceへ照会したAlexaウェイクワード設定
      responses:
        '200': {description: 'Observation.dataにwakeWord(value/enabled/fixed),linkage,writable。0=ON/1=OFF/2=連携による固定ON。アカウント認証状態を推測しない。'}
        '409': {description: '他の純正設定操作を確認中'}
        '503': {description: '純正Voiceまたは専用helperの応答が未確認'}
    put:
      summary: 純正Voice経由でウェイクワードを変更しlive値と永続保存を確認
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expectedValue, enabled], properties: {expectedValue: {type: integer, minimum: 0, maximum: 2}, enabled: {type: boolean}}}
      responses:
        '200': {description: '保存と純正Voice再照会を確認したObservation'}
        '409': {description: '現在値不一致・純正連携の固定ON・他操作中'}
        '503': {description: '変更・保存・最終照会のいずれかが未確認'}
  /plate/status:
    get:
      summary: ナンバー認識の状態（認識プロセス・取込み・発話・保存容量）
      description: 認識プロセスの状態は/run/np1-control-plate/sensor.sockの自己申告のみを返し、推測しない。speech.availableは本体の音声出力（pacat）とVOICEVOX APIキーがそろったときだけtrue。
      responses:
        '200': {description: 'enabled, revision, sensor{state: running|model-missing|engine-missing|error|unavailable, reason, engine, backend, fps, lastFrameAt}, collector{lastPollAt, error}, speech{available, reason}, usage, imageQuotaBytes'}
  /plate/settings:
    get:
      summary: ナンバー認識の設定と条件
      responses:
        '200':
          description: 現在の設定
          content: {application/json: {schema: {$ref: '#/components/schemas/PlateSettings'}}}
    put:
      summary: 設定と条件を置換（revisionで競合を拒否）
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expectedRevision, settings], properties: {expectedRevision: {type: integer}, settings: {$ref: '#/components/schemas/PlateSettings'}}}
      responses:
        '200': {description: 正規化して保存した設定（revision+1）}
        '400': {description: '入力不正。条件はいずれかの項目が必須、番号は数字と*の1〜4桁、分類番号は[0-9A-Z*]の1〜3文字、ひらがなは1文字'}
        '409': {description: expectedRevisionが現在値と不一致}
        '503': {description: 設定を保存できない}
  /plate/records:
    get:
      summary: 認識したナンバーの記録（新しい順、JST日付範囲）
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}, description: 既定は6日前（JST）}
        - {name: to, in: query, schema: {type: string, format: date}, description: 既定は今日（JST）。範囲は366日以内}
        - {name: matched, in: query, schema: {type: string, enum: ['true']}, description: 条件に合致した記録だけ}
        - {name: q, in: query, schema: {type: string}, description: 地名・分類番号・ひらがな・番号の部分一致（全角/カタカナは正規化）}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5000}}
      responses:
        '200': {description: 'records[{record, imageAvailable}], truncated, reason。recordはid, firstSeen, lastSeen, sightings, reading, display, location?, box[x,y,w,h], matches[], imageId?, imageNote?, speech?（requested: 再生待ち、spoken: 本体で再生を完了、failed: 再生できず、unsupported: 発話の設定が無く発話していない）'}
        '400': {description: 未知のquery・不正な期間}
  /plate/speech:
    get:
      summary: 発話の準備状態（音声の生成、条件ごとの準備、選べる声）
      responses:
        '200': {description: 'available, reason, styles[{id, speaker, name}]（APIの話者一覧を24時間キャッシュ）, status{keyConfigured, player?, job{state: idle|generating|waiting|ready|no-key|error, total, ready, error?}, rules{ruleId: {ready, error?}}, style?, credit（例 VOICEVOX:ずんだもん）}'}
  /plate/speech/uploads:
    post:
      summary: 条件のメッセージに使う音声をアップロード（ブラウザで24kHz・モノラル・16bitのWAVへ変換済み、30秒以内）
      requestBody:
        required: true
        content: {audio/wav: {schema: {type: string, format: binary}}}
      responses:
        '200': {description: 'id（PlateRule.messageAudioに指定する20桁hex）, durationMs'}
        '400': {description: WAVでない、または形式が違う}
        '413': {description: 大きすぎる}
  /plate/speech/uploads/{id}:
    get:
      summary: アップロードした音声（audio/wav）
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{20}$'}}
      responses:
        '200': {description: audio/wav}
        '404': {description: 見つからない}
  /plate/speech/rules/{id}/preview:
    get:
      summary: 保存済みの条件の読み上げ（条件の値をナンバーとして使う）をWAVで返す。ブラウザでの試聴用
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: audio/wav}
        '404': {description: 保存済みの条件が無い}
        '503': {description: 音声が無く、APIでも生成できない}
  /plate/speech/preview:
    post:
      summary: 保存済みの条件の読み上げを本体のスピーカーで再生（再生完了まで待つ）
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [ruleId], properties: {ruleId: {type: string}}}}}
      responses:
        '200': {description: 'spoken: true（pacatが再生を完了した）'}
        '404': {description: 保存済みの条件が無い}
        '409': {description: 発話が利用できない（APIキー未設定・音声出力なし）}
        '503': {description: 再生できなかった}
  /voicevox:
    get:
      summary: VOICEVOX API（WEB版VOICEVOX API）の設定。キーは返さず、設定済みかどうかだけを返す
      responses:
        '200': {description: 'endpoint, defaultEndpoint（https://deprecatedapis.tts.quest）, keyConfigured'}
    put:
      summary: エンドポイントとキーを保存（keyを省略すると変更しない、空文字で削除）
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [endpoint], properties: {endpoint: {type: string, format: uri}, key: {type: string, maxLength: 200}}}}}
      responses:
        '200': {description: 'GETと同じ形'}
        '400': {description: 'http(s)以外、認証情報・query付きのURL、空白を含むキー'}
  /voicevox/check:
    post:
      summary: 保存したキーで残りポイントを問い合わせる
      responses:
        '200': {description: 'points, resetInHours'}
        '502': {description: キー未設定・無効・接続不可}
  /plate/records/{id}/image:
    get:
      summary: 条件に合致した記録の保存画像（前方カメラの1フレーム）
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9-]{8,48}$'}}
      responses:
        '200': {description: image/jpeg}
        '404': {description: 画像なし、または保存期間・容量上限で削除済み}
components:
  schemas:
    PlateRule:
      type: object
      additionalProperties: false
      required: [id, name, enabled, region, class, kana, number, saveImage, speak]
      properties:
        id: {type: string, pattern: '^[a-z0-9-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 40}
        enabled: {type: boolean}
        region: {type: string, maxLength: 8, description: 地名。完全一致}
        class: {type: string, pattern: '^[0-9A-Z*]{0,3}$', description: 分類番号。*は任意の1文字}
        kana: {type: string, description: ひらがな1文字（カタカナ入力はひらがなへ正規化）}
        number: {type: string, pattern: '^[0-9*]{0,4}$', description: 一連指定番号。区切りなし、*は任意の1文字}
        saveImage: {type: boolean}
        speak: {type: boolean, description: 合致したら本体のスピーカーで「メッセージ→定型文→ナンバー」を読み上げる}
        message: {type: string, maxLength: 60, description: '読み上げの先頭のメッセージ（例 おかあさんだ！）。保存時にVOICEVOX APIで定型文と合わせて合成する。省略時は空'}
        messageAudio: {type: string, pattern: '^([0-9a-f]{20})?$', description: アップロードした音声のid。指定するとmessageの代わりに使う}
    PlateSettings:
      type: object
      additionalProperties: false
      required: [revision, enabled, rules, retentionDays, imageQuotaMB, mergeSeconds, minConfidence]
      properties:
        revision: {type: integer}
        enabled: {type: boolean}
        rules: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/PlateRule'}}
        retentionDays: {type: integer, minimum: 1, maximum: 3650}
        imageQuotaMB: {type: integer, minimum: 16, maximum: 1024}
        mergeSeconds: {type: integer, minimum: 5, maximum: 300}
        minConfidence: {type: number, minimum: 0.3, maximum: 0.99}
        minSightings: {type: integer, minimum: 1, maximum: 5, default: 2, description: 同じ車両としてこの回数以上読めたものだけを記録する（省略時2）}
        voice:
          type: object
          additionalProperties: false
          description: 読み上げの声。省略・旧形式の設定は既定値（style 1＝ずんだもん あまあま、volume 70、phrase 番号を検知しました。）
          properties:
            style: {type: integer, minimum: 0, maximum: 9999, description: VOICEVOXのスタイルID}
            volume: {type: integer, minimum: 10, maximum: 100, description: 再生ストリームの音量（%）。本体の音量設定は変えない}
            phrase: {type: string, maxLength: 40, description: メッセージの後の定型文}
    StockService:
      type: object
      required: [id, name, label, description, impact, state, subState, mainPID, invocationID, loadState, unitFileState, canStart, canStop, canRestart]
      properties:
        id: {type: string, description: 固定allowlistのopaque id}
        name: {type: string, description: systemd unit名}
        label: {type: string}
        description: {type: string}
        impact: {type: string}
        state: {type: string, description: ActiveState}
        subState: {type: string}
        mainPID: {type: integer, minimum: 0}
        invocationID: {type: string, description: '有効なactive観測では32桁lowerhex。未起動inactiveは空を許可。'}
        loadState: {type: string}
        unitFileState: {type: string}
        canStart: {type: boolean}
        canStop: {type: boolean}
        canRestart: {type: boolean}
        controlReason: {type: string, description: 任意。操作不可等の説明}
    APStatus:
      allOf:
        - {$ref: '#/components/schemas/Observation'}
        - type: object
          properties:
            data:
              type: [object, 'null']
              properties:
                clients:
                  type: [array, 'null']
                  items: {$ref: '#/components/schemas/APClient'}
    APClient:
      type: object
      required: [mac, authorized]
      description: owned hostapdで関連付けを確認した接続端末。leaseだけの端末は含めない。
      properties:
        mac: {type: string}
        ipv4: {type: string, description: 期限内own leaseのMAC一致時だけ補完}
        hostname: {type: string}
        authorized: {type: boolean}
        signalDBm: {type: integer}
        connectedSeconds: {type: integer, minimum: 0}
        receivedBytes:
          type: [string, 'null']
          pattern: '^[0-9]+$'
          description: '任意。端末視点の受信量。hostapd tx_bytes。現在のWi-Fi関連付け中の量で再接続時リセット。管理画面等を含み、回線請求量ではない。欠測は省略/null、実測0とは区別する。'
        sentBytes:
          type: [string, 'null']
          pattern: '^[0-9]+$'
          description: '任意。端末視点の送信量。hostapd rx_bytes。現在のWi-Fi関連付け中の量で再接続時リセット。管理画面等を含み、回線請求量ではない。欠測は省略/null、実測0とは区別する。'
    RecordingStatus:
      type: [object, 'null']
      description: SD上の原本のサイズ・更新時刻・ファイル切替を比較する。サービスactiveや確定済み件数だけでは録画中としない。
      properties:
        writing: {type: [boolean, 'null'], description: 'trueは直近15秒以内の更新を観測。falseは更新なし。nullは初回確認中または取得不能。'}
        cameras:
          type: object
          properties:
            front: {type: [boolean, 'null']}
            in: {type: [boolean, 'null']}
        writingObservedAt: {type: string, format: date-time}
        writingReason: {type: string, description: 任意。録画の更新が取得できない場合の理由}
        finalizedClips: {type: integer, minimum: 0}
        pendingFiles: {type: integer, minimum: 0}
        unreadableFiles: {type: integer, minimum: 0}
        indexedAt: {type: string, format: date-time}
    RecordingCatalog:
      type: object
      required: [clips, days, pendingFiles, unreadableFiles, truncated, timezone, indexedAt]
      properties:
        clips: {type: array, items: {$ref: '#/components/schemas/RecordingClip'}}
        days: {type: array, items: {$ref: '#/components/schemas/RecordingDay'}}
        pendingFiles: {type: integer, minimum: 0}
        unreadableFiles: {type: integer, minimum: 0}
        truncated: {type: boolean, description: 各既知フォルダの20000件上限を超えた場合true}
        timezone: {type: string, const: Asia/Tokyo}
        indexedAt: {type: string, format: date-time}
    RecordingClip:
      type: object
      required: [id, camera, kind, name, startAt, endAt, sizeBytes, durationSeconds]
      properties:
        id: {type: string, description: 同じmount identityと相対パスなら同じID。SD交換後は失効。}
        camera: {type: string, enum: [front, in]}
        kind: {type: string, enum: [normal, event, parking]}
        name: {type: string}
        startAt: {type: string, format: date-time, description: JSTファイル名をUTCへ変換}
        endAt: {type: string, format: date-time, description: startAt + mvhd duration}
        sizeBytes: {type: string, pattern: '^[0-9]+$'}
        durationSeconds: {type: number, exclusiveMinimum: 0, maximum: 86400}
        videoCodec: {type: string, description: MP4 sample entry。実機確認値avc1。}
        audioCodec: {type: string, description: 音声trackがある場合のみ。実機確認値mp4a。}
        width: {type: integer}
        height: {type: integer}
        audioChannels: {type: integer}
        audioSampleRate: {type: integer}
    RecordingDay:
      type: object
      required: [date, count, frontCount, cabinCount, recordedSeconds]
      properties:
        date: {type: string, format: date}
        count: {type: integer, minimum: 0, description: 当日と重なるファイル数。両カメラを含む。}
        frontCount: {type: integer, minimum: 0}
        cabinCount: {type: integer, minimum: 0}
        recordedSeconds: {type: number, minimum: 0, description: 両カメラの録画時間区間の和集合。重複を二重計上しない。}
    NASPolicyChange:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        route: {type: string, enum: [wifi, tailscale]}
        timing: {type: string, enum: [realtime, ssid]}
        ssid: {type: string, description: 'timing=ssidのとき接続を待つWi-Fi STAのSSID。最大32byte。'}
        targets:
          type: object
          additionalProperties: false
          properties:
            wifi: {$ref: '#/components/schemas/NASTargetChange'}
            tailscale: {$ref: '#/components/schemas/NASTargetChange'}
    NASTargetChange:
      type: object
      additionalProperties: false
      properties:
        protocol: {type: string, enum: [smb, sftp, webdav]}
        host: {type: string}
        port: {type: integer, minimum: 0, maximum: 65535, description: '0でプロトコルの標準ポート'}
        share: {type: string, description: SMBの共有名}
        directory: {type: string, description: 保存先フォルダー}
        scheme: {type: string, enum: [http, https]}
        hostKeySHA256: {type: string, description: SFTPのSHA256ホスト鍵指紋}
        username: {type: string, writeOnly: true, description: 省略・空欄で保存済み値を維持}
        password: {type: string, writeOnly: true, description: 省略・空欄で保存済み値を維持}
    Observation:
      type: object
      required: [status, observedAt, source, refreshSeconds, verified, data]
      properties:
        status:
          type: string
          enum: [available, unsupported, permission-denied, busy, error, stale, unknown]
        observedAt: {type: string, format: date-time}
        source: {type: string}
        refreshSeconds: {type: integer}
        verified: {type: boolean}
        data: {}
        reason: {type: string}
