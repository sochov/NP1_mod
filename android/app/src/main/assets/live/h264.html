<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0b0e13;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;background:#0b0e13}
</style>
</head>
<body>
<video id="v" muted playsinline autoplay></video>
<script>
// H.264 live view for the Android app. The page is loaded with the NP1 address as its base URL,
// so these requests are same-origin, exactly like the Web UI's LiveCamera.vue (WebRTC over UDP).
'use strict'
const bridge = window.NccBridge
const params = new URLSearchParams(location.hash.slice(1))
const source = params.get('source') === 'in' ? 'in' : 'front'
const video = document.getElementById('v')
let csrf = '', session = '', peer = null, active = true, generation = 0, hasFrame = false

function report(state, w, h, fps) { try { bridge && bridge.status(state, w || 0, h || 0, fps || 0) } catch (e) {} }
async function token() {
  const r = await fetch('/api/v1/auth/session', {credentials: 'same-origin', cache: 'no-store'})
  const j = await r.json(); csrf = j.csrf || ''
}
async function api(path, method, body, signal, keepalive) {
  const headers = {'Content-Type': 'application/json'}
  if (method !== 'GET') { headers['X-CSRF-Token'] = csrf; headers['X-Request-ID'] = String(Date.now()) + Math.random().toString(16).slice(2) }
  let r = await fetch('/api/v1' + path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body), credentials: 'same-origin', signal, keepalive: !!keepalive})
  if (r.status === 403 && method !== 'GET') { await token(); headers['X-CSRF-Token'] = csrf; r = await fetch('/api/v1' + path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body), credentials: 'same-origin', signal, keepalive: !!keepalive}) }
  if (!r.ok) throw new Error('HTTP ' + r.status)
  const text = await r.text(); return text ? JSON.parse(text) : {}
}
async function release(keepalive) { const id = session; session = ''; if (id) { try { await api('/camera/sessions/' + encodeURIComponent(id), 'DELETE', undefined, undefined, keepalive) } catch (e) {} } }
function gathered(pc) {
  return new Promise((resolve, reject) => {
    if (pc.iceGatheringState === 'complete') return resolve()
    const t = setTimeout(() => { pc.removeEventListener('icegatheringstatechange', f); reject(new Error('ice')) }, 5000)
    const f = () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); pc.removeEventListener('icegatheringstatechange', f); resolve() } }
    pc.addEventListener('icegatheringstatechange', f)
  })
}
const sleep = ms => new Promise(r => setTimeout(r, ms))
async function loop() {
  const g = ++generation
  if (typeof RTCPeerConnection === 'undefined') { report('unsupported'); return }
  try { await token() } catch (e) { report('error'); return }
  while (active && g === generation) {
    try {
      report(hasFrame ? 'waiting' : 'loading')
      if (!session) { const s = await api('/camera/sessions', 'POST', {source, color: 'source', resolution: '360p'}); session = s.id }
      const pc = new RTCPeerConnection({iceServers: []}); peer = pc
      pc.addTransceiver('video', {direction: 'recvonly'})
      let finish; const ended = new Promise(r => finish = r); let dt
      pc.ontrack = ev => { video.srcObject = ev.streams[0] || new MediaStream([ev.track]); video.play().catch(() => {}) }
      pc.onconnectionstatechange = () => {
        clearTimeout(dt)
        if (pc.connectionState === 'failed' || pc.connectionState === 'closed') finish()
        else if (pc.connectionState === 'disconnected') dt = setTimeout(() => { if (pc.connectionState === 'disconnected') finish() }, 2000)
      }
      await pc.setLocalDescription(await pc.createOffer())
      await gathered(pc)
      const answer = await api('/camera/sessions/' + encodeURIComponent(session) + '/webrtc', 'POST', {type: pc.localDescription.type, sdp: pc.localDescription.sdp})
      if (answer.transport !== 'webrtc-udp-h264' || !answer.sdp) throw new Error('answer')
      window.__size = [answer.width || 1920, answer.height || 1080, answer.fps || 0]
      await pc.setRemoteDescription({type: answer.type, sdp: answer.sdp})
      const watchdog = setTimeout(() => { if (!hasFrame) finish() }, 12000)
      await ended; clearTimeout(watchdog); clearTimeout(dt)
    } catch (e) {
      if (String(e && e.message).startsWith('HTTP 403') || String(e && e.message).startsWith('HTTP 404')) session = ''
    } finally { if (peer) { peer.close(); peer = null } }
    if (active && g === generation) { report(hasFrame ? 'waiting' : 'retry'); hasFrame = false; await sleep(800) }
  }
}
video.addEventListener('playing', () => { hasFrame = true; const s = window.__size || [video.videoWidth, video.videoHeight, 0]; report('live', video.videoWidth || s[0], video.videoHeight || s[1], s[2]) })
video.addEventListener('waiting', () => { setTimeout(() => { if (video.readyState < 3) report('waiting') }, 700) })
window.nccStop = () => { active = false; generation++; if (peer) { peer.close(); peer = null } video.srcObject = null; return release(true) }
window.addEventListener('pagehide', () => { window.nccStop() })
loop()
</script>
</body>
</html>
